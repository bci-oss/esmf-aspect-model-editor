<ng-container *transloco="let t">
  <div class="ai-welcome" data-testid="ai-welcome">
    <p>{{ t('ai.panel.welcome') }}</p>
    <div class="ai-welcome__starters">
      @for (starter of starters; track starter.key) {
        <button
          [disabled]="starter.command !== 'generate' && !modelOpen()"
          [attr.data-testid]="'ai-starter-' + starter.key"
          (click)="started.emit(starter)"
          mat-stroked-button
          type="button"
        >
          <mat-icon>{{ starter.icon }}</mat-icon
          >{{ t('ai.starters.' + starter.key + '.label') }}
        </button>
      }
    </div>
    <p class="ai-welcome__tip">{{ t('ai.panel.tip') }}</p>
  </div>
</ng-container>
