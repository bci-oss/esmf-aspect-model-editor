<ng-container *transloco="let t">
  <section class="ai-setup" [class.ai-setup--settings]="inSettings()" data-testid="ai-setup">
    @if (!inSettings()) {
      <h3 class="ai-setup__title">{{ t('ai.setup.title') }}</h3>
      <p class="ai-setup__intro">{{ t('ai.setup.intro') }}</p>
    }

    <ame-ai-provider-picker
      [choices]="store.providerChoices()"
      [selected]="kind()"
      [localServers]="store.localServers()"
      [detailed]="inSettings()"
      (providerSelected)="choose($event)"
      (localServerSelected)="useLocalServer($event)"
    />

    @if (kind(); as selected) {
      <div class="ai-setup__details" data-testid="ai-setup-details">
        @if (selected === 'copilot') {
          <ame-ai-copilot-login
            [status]="store.copilotStatus()"
            [flow]="store.loginFlow()"
            [state]="store.loginState()"
            [error]="store.loginError()"
            (loginRequested)="login()"
            (logoutRequested)="store.logoutCopilot()"
            (loginCancelled)="store.cancelCopilotLogin()"
            (tokenSubmitted)="saveToken($event)"
          />
        }

        @if (store.requiresKey()) {
          <ame-ai-key-field
            [(key)]="keyInput"
            [info]="store.keyInfo()"
            [saving]="savingKey()"
            (keySubmitted)="saveKey($event)"
            (keyDeleted)="deleteKey()"
          />
        }

        <ame-ai-model-fields
          [showBaseUrl]="showBaseUrl()"
          [baseUrl]="store.settings().baseUrl"
          [model]="store.settings().model"
          [models]="store.models()"
          (baseUrlChanged)="updateBaseUrl($event)"
          (modelSelected)="store.selectModel($event)"
        />

        <ame-ai-connection-test
          [testing]="store.testing()"
          [result]="store.testResult()"
          [finishable]="store.configured() && !inSettings()"
          (testRequested)="store.testConnection()"
          (finished)="finish()"
        />
      </div>
    }
  </section>
</ng-container>
