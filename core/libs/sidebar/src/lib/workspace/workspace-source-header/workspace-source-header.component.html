<div class="source-row" *transloco="let t">
  <button
    class="source"
    [class.source--read-only]="readOnly()"
    [attr.aria-expanded]="!collapsed()"
    [matTooltip]="source()?.path ?? ''"
    [attr.data-testid]="'workspace-source-' + (source()?.type ?? 'unknown')"
    (click)="toggleCollapsed.emit()"
    type="button"
  >
    <mat-icon class="source__chevron">{{ collapsed() ? 'chevron_right' : 'expand_more' }}</mat-icon>
    <mat-icon>{{ source()?.type === 'github' ? 'cloud' : source()?.defaultWorkspace ? 'home' : 'folder_special' }}</mat-icon>
    <span class="source__name">{{ source()?.name ?? '–' }}</span>
    @if (readOnly()) {
      <span class="source__badge" data-testid="workspace-source-read-only">{{ t('modelSources.sidebar.readOnlyBadge') }}</span>
    }
  </button>
  @if (source(); as folder) {
    @if (folder.path) {
      <button
        class="source-open"
        [matTooltip]="t('externalEditor.openSourceIn', {editor: editorName()})"
        [attr.aria-label]="t('externalEditor.openSourceIn', {editor: editorName()})"
        (click)="openInEditor.emit(folder)"
        type="button"
        data-testid="workspace-source-open-in-editor"
      >
        <mat-icon>open_in_new</mat-icon>
      </button>
    }
  }
</div>
