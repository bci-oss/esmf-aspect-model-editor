<ng-container *transloco="let t">
  <section class="ai-consent" [attr.aria-label]="t('ai.consent.title')" role="dialog" aria-modal="false" data-testid="ai-consent">
    <h3 class="ai-consent__title"><mat-icon>privacy_tip</mat-icon>{{ t('ai.consent.title') }}</h3>
    <p>{{ t('ai.consent.text', {provider: providerLabel()}) }}</p>
    <ul class="ai-consent__list">
      <li>{{ t('ai.consent.data') }}</li>
      <li>{{ t('ai.consent.noKeys') }}</li>
      <li>{{ t('ai.consent.revoke') }}</li>
    </ul>
    <div class="ai-consent__actions">
      <button (click)="useLocal.emit()" mat-button type="button" data-testid="ai-consent-local">{{ t('ai.consent.useLocal') }}</button>
      <button (click)="declined.emit()" mat-button type="button" data-testid="ai-consent-decline">{{ t('ai.consent.decline') }}</button>
      <button (click)="accepted.emit()" mat-flat-button color="primary" type="button" data-testid="ai-consent-accept">
        {{ t('ai.consent.accept') }}
      </button>
    </div>
  </section>
</ng-container>
