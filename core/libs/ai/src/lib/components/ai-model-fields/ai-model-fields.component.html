<ng-container *transloco="let t">
  @if (showBaseUrl()) {
    <mat-form-field class="ai-model-fields__field" subscriptSizing="dynamic">
      <mat-label>{{ t('ai.setup.baseUrl') }}</mat-label>
      <input [value]="baseUrl() ?? ''" (change)="onBaseUrlChange($event)" matInput data-testid="ai-base-url" />
    </mat-form-field>
  }

  <mat-form-field class="ai-model-fields__field" subscriptSizing="dynamic">
    <mat-label>{{ t('ai.setup.model') }}</mat-label>
    @if (models().length) {
      <mat-select [value]="model() ?? ''" (selectionChange)="selectModel($event.value)" data-testid="ai-model-select">
        @for (option of models(); track option.id) {
          <mat-option [value]="option.id">{{ option.name || option.id }}</mat-option>
        }
      </mat-select>
    } @else {
      <input [value]="model() ?? ''" (change)="onModelChange($event)" matInput data-testid="ai-model-input" />
    }
  </mat-form-field>
</ng-container>
