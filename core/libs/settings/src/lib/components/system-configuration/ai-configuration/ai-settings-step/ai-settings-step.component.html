<div class="ai-settings-step__number" aria-hidden="true">{{ step() }}</div>
<div class="ai-settings-step__body">
  <h3 class="ai-settings-step__title">{{ title() }}</h3>
  @if (description()) {
    <p class="ai-settings-step__description">{{ description() }}</p>
  }
  @if (disabled() && disabledHint()) {
    <p class="ai-settings-step__disabled-hint" data-testid="aiSettingsStepDisabledHint">{{ disabledHint() }}</p>
  } @else {
    <div class="ai-settings-step__content">
      <ng-content />
    </div>
  }
</div>
