<mat-form-field [floatLabel]="field().disabled() ? 'always' : 'auto'" appearance="fill" subscriptSizing="dynamic">
  <mat-label>integer</mat-label>
  <input [formField]="field" matInput data-cy="integer" type="number" />
  @if (hasError('required')) {
    <mat-error>Integer is required</mat-error>
  }
  @if (hasError('pattern')) {
    <mat-error>Please provide a positive integer</mat-error>
  }
</mat-form-field>
