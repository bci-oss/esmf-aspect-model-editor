<ng-container *transloco="let t">
  <!-- Toolbar -->
  <div
    class="menu-items"
    (click)="blurActiveButton()"
    (keyup.enter)="blurActiveButton()"
    (keyup.space)="blurActiveButton()"
    tabindex="0"
    role="button"
    aria-label="Menu"
  >
    <div class="menu-items__group separator">
      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isTextView() || !canUndo()"
        [matTooltip]="t('toolbar.undo')"
        (itemClick)="onUndo()"
        data-testid="tbUndoButton"
      >
        <mat-icon class="material-icons">undo</mat-icon>
      </ame-bar-item>

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isTextView() || !canRedo()"
        [matTooltip]="t('toolbar.redo')"
        (itemClick)="onRedo()"
        data-testid="tbRedoButton"
      >
        <mat-icon class="material-icons">redo</mat-icon>
      </ame-bar-item>
    </div>

    <div class="menu-items__group separator">
      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isTextView() || isModelEmpty() || selectedCells()?.length !== 1"
        [matTooltip]="t('toolbar.editHighlightedCell')"
        (itemClick)="editSelectedCell()"
      >
        <mat-icon class="material-symbols-outlined">jump_to_element</mat-icon>
      </ame-bar-item>

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isTextView() || isModelEmpty() || !hasSelection()"
        [matTooltip]="t('toolbar.delete')"
        (itemClick)="onDelete()"
        data-testid="tbDeleteButton"
      >
        <mat-icon class="material-icons">delete</mat-icon>
      </ame-bar-item>

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isTextView() || isModelEmpty() || selectedCells()?.length !== 2"
        [matTooltip]="t('toolbar.connect')"
        (itemClick)="onConnect()"
        data-testid="tbConnectButton"
      >
        <mat-icon class="material-icons">commit</mat-icon>
      </ame-bar-item>

      @if (isAllShapesExpanded()) {
        <ame-bar-item
          [matTooltipShowDelay]="0"
          [matTooltipHideDelay]="0"
          [disabled]="isTextView() || isModelEmpty()"
          [matTooltip]="t('toolbar.collapseAll')"
          (itemClick)="onToggleExpand()"
          data-testid="collapseExpandToggle"
        >
          <mat-icon class="material-icons rotate-45">unfold_less</mat-icon>
        </ame-bar-item>
      } @else {
        <ame-bar-item
          [matTooltipShowDelay]="0"
          [matTooltipHideDelay]="0"
          [disabled]="isTextView() || isModelEmpty()"
          [matTooltip]="t('toolbar.expandAll')"
          (itemClick)="onToggleExpand()"
          data-testid="collapseExpandToggle"
        >
          <mat-icon class="material-icons rotate-45 editor-icon-active">unfold_more</mat-icon>
        </ame-bar-item>
      }

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isTextView() || isModelEmpty()"
        [matTooltip]="t('toolbar.format')"
        (itemClick)="onFormat()"
        data-testid="formatButton"
      >
        <mat-icon class="material-icons rotate-90">schema</mat-icon>
      </ame-bar-item>

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isTextView() || isModelEmpty()"
        [matTooltip]="isPropertyFilterActive() ? t('toolbar.propertyFilterDeactivate') : t('toolbar.propertyFilterActivate')"
        [class.toolbar-item--active]="isPropertyFilterActive()"
        [attr.aria-pressed]="isPropertyFilterActive()"
        (itemClick)="togglePropertyFilter()"
        data-testid="tbPropertyFilterButton"
      >
        <mat-icon class="material-icons">filter_list</mat-icon>
      </ame-bar-item>

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isTextView() || !refactoringElement()"
        [matTooltip]="refactoringElement() ? t('refactoring.elementMenu.tooltip') : t('refactoring.elementMenu.noSelection')"
        [matMenuTriggerFor]="isTextView() || !refactoringElement() ? null : refactoringMenu"
        [matMenuTriggerData]="{element: refactoringElement()}"
        [matMenuTriggerRestoreFocus]="false"
        data-testid="tbRefactoringButton"
      >
        <mat-icon class="material-icons">drive_file_rename_outline</mat-icon>
      </ame-bar-item>

      <mat-menu #refactoringMenu="matMenu">
        <ng-template let-element="element" matMenuContent>
          @let blocker = refactoringBlocker(element);
          <!-- A disabled menu item does not receive pointer events, so its tooltip sits on a wrapper. -->
          <span
            class="menu-item-wrapper"
            [matTooltip]="blocker ? t('refactoring.elementMenu.blocked.' + blocker) : ''"
            matTooltipPosition="right"
            data-testid="tbRefactoringBlocked"
          >
            <button [disabled]="!!blocker" (click)="refactor('RENAME_ELEMENT', element)" mat-menu-item data-testid="tbRefactoringRename">
              <mat-icon>drive_file_rename_outline</mat-icon>
              <span>{{ t('refactoring.elementMenu.rename') }}</span>
            </button>
            <button [disabled]="!!blocker" (click)="refactor('MOVE_ELEMENT', element)" mat-menu-item data-testid="tbRefactoringMove">
              <mat-icon>drive_file_move</mat-icon>
              <span>{{ t('refactoring.elementMenu.move') }}</span>
            </button>
          </span>
          <button [disabled]="!canShowUsages(element)" (click)="showUsages(element)" mat-menu-item data-testid="tbRefactoringUsages">
            <mat-icon>account_tree</mat-icon>
            <span>{{ t('refactoring.elementMenu.usages') }}</span>
          </button>
        </ng-template>
      </mat-menu>

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isModelEmpty()"
        [matTooltip]="t('toolbar.validate')"
        (itemClick)="validateFile()"
        data-testid="tbValidateButton"
      >
        <mat-icon class="material-icons">task</mat-icon>
      </ame-bar-item>

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isModelEmpty()"
        [matTooltip]="t('toolbar.prefixes')"
        (itemClick)="openPrefixManagement()"
        data-testid="tbPrefixesButton"
      >
        <mat-icon class="material-icons">alternate_email</mat-icon>
      </ame-bar-item>
    </div>

    <div class="menu-items__group">
      <ame-bar-item [disabled]="isTextView() || isModelEmpty()" [matTooltip]="t('editorCanvas.zoomInProgress')" (itemClick)="zoomIn()">
        <mat-icon>zoom_in</mat-icon>
      </ame-bar-item>
      <ame-bar-item [disabled]="isTextView() || isModelEmpty()" [matTooltip]="t('editorCanvas.zoomOutProgress')" (itemClick)="zoomOut()">
        <mat-icon>zoom_out</mat-icon>
      </ame-bar-item>
    </div>
  </div>
</ng-container>
