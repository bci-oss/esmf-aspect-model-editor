<ng-container *transloco="let t">
  <div class="ai-error" [attr.data-code]="error().code" role="alert" data-testid="ai-error">
    <mat-icon class="ai-error__icon">error_outline</mat-icon>
    <div class="ai-error__body">
      <span class="ai-error__message">{{ t(view().messageKey) }}</span>
      @if (view().detail) {
        <span class="ai-error__detail">{{ view().detail }}</span>
      }
      @if (view().actions.length) {
        <div class="ai-error__actions">
          @for (item of view().actions; track item) {
            <button [attr.data-testid]="'ai-error-action-' + item" (click)="action.emit(item)" mat-button type="button">
              {{ t('ai.errorActions.' + item) }}
            </button>
          }
        </div>
      }
    </div>
    @if (dismissible()) {
      <button class="ai-error__close" [attr.aria-label]="t('ai.common.close')" (click)="dismissed.emit()" mat-icon-button type="button">
        <mat-icon>close</mat-icon>
      </button>
    }
  </div>
</ng-container>
